[project]
name = "line-ext-msg"
version = "1.0.0"
description = "Pull messages from LINE Chrome Extension via Playwright CDP (own account, read-only)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ITC6910120" }]
keywords = ["line", "chrome-extension", "playwright", "cdp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = ["playwright>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
line-ext-msg = "line_ext_msg.cli:main"

[project.urls]
Homepage = "https://github.com/ITC6910120/line-extension-get-message"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/line_ext_msg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
